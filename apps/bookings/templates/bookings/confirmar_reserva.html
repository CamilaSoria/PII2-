<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Intención de Viaje</title>
    <script src="path/to/tu/carpeta/js/reservas.js" defer></script>
</head>
<body>

    <div>
        <h2>Formalizar Reserva</h2>
        <p>Estás a un paso de reservar tu lugar para el paquete: <br><strong>{{ inventario.paquete.nombre }}</strong></p>
        <p>Alojamiento: {{ inventario.hotel.nombre }} ({{ inventario.tipo_habitacion }})</p>
        
        <form method="post" id="confirmarReservaForm">
            {% csrf_token %}
            
            <div>
                <label for="fecha_salida">Selecciona tu Fecha de Salida:</label>
                <input type="date" id="fecha_salida" name="fecha_salida" value="2026-07-15" required>
            </div>
            
            <div>
                <label for="num_personas">Número de Personas:</label>
                <input type="number" id="num_personas" name="num_personas" min="1" max="5" value="2" required>
            </div>
            
            <button type="submit" id="btnConfirmar">Confirmar y Proceder al Pago</button>
        </form>

        <div>
            <a href="{% url 'lista_paquetes' %}">Volver al catálogo</a>
        </div>
    </div>

</body>
</html>
