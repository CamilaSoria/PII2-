<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Contraseña</title>
</head>
<body>

    <div>
        <h2>Nueva Contraseña</h2>
        <p>Ingresa tu nueva contraseña y confírmala para restablecer el acceso a tu cuenta.</p>
        
        {% if error %}
            <div>
                {{ error }}
            </div>
        {% endif %}

        <form method="post" id="newPasswordForm">
            {% csrf_token %}
            
            <div>
                <label for="password">Nueva Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>
            
            <div>
                <label for="password_confirm">Confirmar Nueva Contraseña:</label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Repite tu contraseña" minlength="8" required>
            </div>
            
            <button type="submit" id="btnActualizar">Actualizar Contraseña</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('newPasswordForm');
            const pass1 = document.getElementById('password');
            const pass2 = document.getElementById('password_confirm');

            form.addEventListener('submit', function(e) {
                if (pass1.value !== pass2.value) {
                    e.preventDefault();
                    alert('Las contraseñas no coinciden. Por favor, verifícalas.');
                }
            });
        });
    </script>
</body>
</html>
