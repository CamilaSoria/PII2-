<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
</head>
<body>

    <div>
        <h2>Recuperar Contraseña</h2>
        <p>Introduce tu correo electrónico abajo y te enviaremos un enlace seguro para que puedas restablecerla.</p>
        
        <form method="post" id="resetForm">
            {% csrf_token %}
            
            <div>
                <label for="email">Tu Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <button type="submit" id="btnEnviar">Enviar Enlace</button>
        </form>

        <div>
            <a href="{% url 'authentication:login' %}">Volver al Iniciar Sesión</a>
        </div>
    </div>

</body>
</html>
