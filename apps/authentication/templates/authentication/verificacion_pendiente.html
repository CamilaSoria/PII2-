<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Correo</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 sm:p-10 text-center">
    <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
        <span class="text-3xl">📬</span>
    </div>
    <h2 class="text-2xl font-black text-slate-900 mb-3">¡Ya casi está listo!</h2>
    <p class="text-sm text-slate-500 leading-relaxed mb-8">
        Te hemos enviado un correo de verificación. Por favor, revisa tu bandeja de entrada o la carpeta de spam para activar tu cuenta.
    </p>
    <a href="{% url 'authentication:login' %}"
       class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-200 text-sm uppercase tracking-wider shadow-md shadow-blue-600/10">
        Entendido, ir al Login
        <span>→</span>
    </a>
</div>

</body>
</html>
