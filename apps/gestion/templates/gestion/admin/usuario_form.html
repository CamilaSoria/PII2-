{% extends 'base_dashboard.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/gestion.css' %}">
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="mb-4">
        <a href="{% url 'gestion:lista_usuarios' %}" class="text-decoration-none">⬅️ Volver al listado</a>
        <h1 class="h3 mt-2 text-dark">✏️ Editar Permisos de Usuario</h1>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre Completo</label>
                    {{ form.nombre }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Electrónico</label>
                    {{ form.email }}
                </div>

                <hr class="my-4">

                <div class="form-check form-switch mb-3">
                    {{ form.is_active }}
                    <label class="form-check-label fw-semibold" for="{{ form.is_active.id_for_label }}">Cuenta Activa (Desmarcar para banear)</label>
                </div>

                <div class="form-check form-switch mb-3">
                    {{ form.is_staff }}
                    <label class="form-check-label fw-semibold" for="{{ form.is_staff.id_for_label }}">Acceso al Staff (Habilita entrada al Dashboard)</label>
                </div>

                <div class="form-check form-switch mb-4">
                    {{ form.is_superuser }}
                    <label class="form-check-label text-danger fw-bold" for="{{ form.is_superuser.id_for_label }}">Permisos de Superusuario (Control Total) ⚠️</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
